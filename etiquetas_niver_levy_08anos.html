<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Etiquetas Retangulares - Niver Leví 8 Anos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --sonic-blue: #0055BF;
            --sonic-yellow: #FFD700;
            --capivara-brown: #8D5524;
            --bg-card: #E0F7FA;
            --border-color: #0055BF;
        }

        body { margin: 0; padding: 0; background: #f0f0f0; font-family: 'Poppins', sans-serif; }

        /* Configuração da Folha A4 */
        .folha-a4 {
            width: 210mm;
            height: 297mm;
            padding: 10mm;
            margin: 20px auto;
            background: white;
            display: grid;
            /* 4 colunas iguais */
            grid-template-columns: repeat(4, 1fr); 
            /* 10 linhas */
            grid-template-rows: repeat(10, 1fr);
            gap: 2mm; 
            box-sizing: border-box;
        }

        /* Design da Etiqueta Festiva */
        .etiqueta {
            border: 2px dashed var(--border-color);
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4px;
            box-sizing: border-box;
            position: relative;
            border-radius: 6px;
        }

        .frase {
            color: #111;
            font-weight: 700;
            font-size: 7pt;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 2px;
        }

        .brand-footer {
            color: var(--sonic-blue);
            font-size: 5pt;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .btn-print {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 30px;
            background: var(--sonic-blue);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        @media print {
            body { background: none; }
            .folha-a4 { margin: 0; border: none; }
            .btn-print { display: none; }
            .etiqueta { border: 1px dotted #888; }
            @page { size: A4; margin: 0; }
        }
    </style>
</head>
<body>

    <button class="btn-print" onclick="window.print()">IMPRIMIR 40 ETIQUETAS (A4)</button>

    <div class="folha-a4" id="container"></div>

    <script>
        const frasesBase = [
            "Sonic & Capivara: Modo Turbo!",
            "Leví 8 Anos: Veloz e Feroz!",
            "Coquetel Oficial do Capitão Leví!",
            "Capivara Gamer & Super Sonic!",
            "Combustível de Campeão!",
            "Velocidade Máxima nos 8 Anos!",
            "Suco Secreto da Ilha Verde!",
            "Treino de Capoeira & Sabor!",
            "Energia Pura com o Sonic!",
            "Festa do Leví: Liberado Brincar!",
            "Capivara de Boa na Lagoa!",
            "Anéis Dourados e Muita Diversão!",
            "Faixa Preta em Alegria!",
            "Foco, Força e Super Sonic!",
            "Parabéns Leví! 8 Anos de Sucesso!",
            "O Drink Mais Rápido do Mundo!"
        ];

        const container = document.getElementById('container');

        // Gerar 40 etiquetas com a nova temática infantil/festiva
        for (let i = 0; i < 40; i++) {
            const fraseSorteada = frasesBase[i % frasesBase.length];
            const div = document.createElement('div');
            div.className = 'etiqueta';
            div.innerHTML = `
                <div class="frase">${fraseSorteada}</div>
                <div class="brand-footer">LEVÍ • 8 ANOS 🦔 capivara</div>
            `;
            container.appendChild(div);
        }
    </script>
</body>
</html>
